name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        php: ['8.1', '8.3', '8.5']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: curl, dom, mbstring, zlib
          coverage: none
      - name: Validate package metadata
        run: composer validate --strict --no-check-publish
      - name: Check PHP syntax
        shell: bash
        run: git ls-files -z '*.php' | xargs -0 -n1 php -l
      - name: Run offline parser and local HTTP integration tests
        run: php tests/run.php
